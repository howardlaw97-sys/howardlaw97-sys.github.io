<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hao Luo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fdfdfd;
            --fg: #111;
            --muted: #888;
            --line: #e5e5e5;
            --error: #c33;
        }

        html, body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .lang-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            z-index: 10;
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-family: inherit;
            font-weight: 500;
        }

        .lang-switch:hover,
        .lang-switch:focus {
            color: var(--fg);
            border-color: var(--fg);
            outline: none;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 130px 32px 80px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .name {
            font-size: 44px;
            font-weight: 300;
            letter-spacing: -0.8px;
            margin-bottom: 28px;
        }

        .divider {
            width: 36px;
            height: 1px;
            background: var(--fg);
            margin-bottom: 36px;
        }

        .bio,
        .now-text {
            font-size: 16px;
            line-height: 1.85;
            color: #2a2a2a;
        }

        .bio { margin-bottom: 72px; }

        .section-heading,
        .guestbook-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }

        html[lang="zh-CN"] .section-label {
            letter-spacing: 0.3px;
            font-size: 12px;
        }

        .contact-list { list-style: none; }

        .contact-item {
            display: grid;
            grid-template-columns: 88px minmax(0, 1fr) auto;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            align-items: baseline;
        }

        .contact-label {
            color: var(--muted);
            font-size: 13px;
        }

        .contact-value {
            color: var(--fg);
            text-decoration: none;
            font-variant-numeric: tabular-nums;
            word-break: break-word;
        }

        a.contact-value { transition: color 0.25s ease; }
        a.contact-value:hover { color: var(--muted); }

        .copy-button,
        .admin-button,
        .admin-text-button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            white-space: nowrap;
        }

        html[lang="zh-CN"] .copy-button,
        html[lang="zh-CN"] .admin-button,
        html[lang="zh-CN"] .admin-text-button {
            font-size: 12px;
        }

        .copy-button:hover,
        .admin-text-button:hover { color: var(--fg); }

        .admin-button {
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
        }

        .admin-button:hover {
            color: var(--fg);
            border-color: var(--fg);
        }

        .admin-only { display: none; }
        body.admin-mode .admin-only { display: inline-flex; }
        body.admin-mode .admin-panel.admin-only { display: block; }
        .admin-panel[hidden] { display: none !important; }

        .admin-panel {
            margin-top: 22px;
            padding: 18px 18px 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .admin-panel-title {
            font-size: 12px;
            color: var(--fg);
            font-weight: 600;
            margin-bottom: 14px;
        }

        .admin-grid {
            display: grid;
            gap: 14px;
        }

        .admin-field label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .admin-field input,
        .admin-field textarea {
            display: block;
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: transparent;
            color: var(--fg);
            font: inherit;
            font-size: 14px;
            outline: none;
        }

        .admin-field textarea {
            min-height: 88px;
            resize: vertical;
            line-height: 1.6;
        }

        .admin-field input:focus,
        .admin-field textarea:focus {
            border-color: var(--fg);
        }

        .admin-actions {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-top: 16px;
        }

        .admin-save {
            padding: 7px 16px;
            border: none;
            border-radius: 999px;
            background: var(--fg);
            color: var(--bg);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .admin-save:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .admin-status {
            margin-top: 12px;
            min-height: 1em;
            font-size: 12px;
            color: var(--muted);
            white-space: pre-wrap;
        }

        .admin-status.error { color: var(--error); }

        .now { margin-top: 72px; }
        .guestbook { margin-top: 80px; }
        .guestbook-heading .section-label { margin-bottom: 0; }

        .message-count {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .guestbook-form { margin-bottom: 56px; }

        .guestbook-form input,
        .guestbook-form textarea {
            display: block;
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--line);
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--fg);
            outline: none;
            resize: none;
            transition: border-color 0.25s ease;
        }

        .guestbook-form input:focus,
        .guestbook-form textarea:focus { border-bottom-color: var(--fg); }
        .guestbook-form input::placeholder,
        .guestbook-form textarea::placeholder { color: var(--muted); }

        .guestbook-form textarea {
            min-height: 64px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .guestbook-submit {
            margin-top: 20px;
            padding: 9px 22px;
            background: var(--fg);
            color: var(--bg);
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        html[lang="zh-CN"] .guestbook-submit {
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .guestbook-submit:hover { opacity: 0.85; }
        .guestbook-submit:disabled { opacity: 0.4; cursor: not-allowed; }

        .guestbook-status {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            min-height: 1em;
        }

        .guestbook-status.error { color: var(--error); }

        .messages-list { list-style: none; }

        .message {
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
        }

        .message.is-hidden {
            opacity: 0.48;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .message-author {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
        }

        .message-time {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .message-hidden-badge {
            font-size: 11px;
            color: var(--error);
            border: 1px solid rgba(204, 51, 51, 0.25);
            border-radius: 999px;
            padding: 1px 7px;
        }

        .message-actions {
            margin-left: auto;
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .message-delete,
        .message-visibility {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        html[lang="zh-CN"] .message-delete,
        html[lang="zh-CN"] .message-visibility {
            font-size: 12px;
        }

        .message-delete:hover {
            color: var(--error);
            background: rgba(204, 51, 51, 0.06);
        }

        .message-visibility:hover {
            color: var(--fg);
            background: rgba(0, 0, 0, 0.04);
        }

        .message-content {
            font-size: 14px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .messages-empty,
        .messages-loading,
        .messages-error {
            padding: 24px 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .messages-error {
            color: var(--error);
            letter-spacing: 0;
            text-align: left;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .debug-panel {
            display: none;
            margin-top: 28px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 12px;
            color: var(--muted);
            word-break: break-word;
        }

        .debug-panel.is-visible { display: block; }

        .debug-title {
            color: var(--fg);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .debug-message {
            color: var(--error);
            white-space: pre-wrap;
        }

        .hp-field {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .footer {
            margin-top: 96px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .container { padding: 100px 24px 60px; }
            .name { font-size: 34px; }
            .bio { font-size: 15px; margin-bottom: 56px; }

            .contact-item {
                grid-template-columns: 72px minmax(0, 1fr) auto;
                gap: 12px;
                font-size: 14px;
            }

            .lang-switch { top: 20px; right: 20px; padding: 6px 12px; }
            .guestbook { margin-top: 64px; }
            .now { margin-top: 64px; }

            .message-actions {
                width: 100%;
                margin-left: 0;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>
    <button class="lang-switch" type="button" id="langBtn">EN</button>

    <main class="container">
        <h1 class="name">Hao Luo</h1>
        <div class="divider"></div>

        <p class="bio" id="bioText"></p>

        <section class="contact-section">
            <div class="section-heading">
                <div class="section-label" data-zh="联系方式" data-en="CONTACT">联系方式</div>
                <button class="admin-button admin-only" type="button" id="editContactBtn" data-zh="编辑" data-en="Edit">编辑</button>
            </div>

            <ul class="contact-list" id="contactList"></ul>

            <div class="admin-panel admin-only" id="contactEditor" hidden>
                <div class="admin-panel-title" data-zh="编辑联系方式" data-en="Edit contact info">编辑联系方式</div>
                <div class="admin-grid">
                    <div class="admin-field">
                        <label for="editEmail" data-zh="邮箱" data-en="Email">邮箱</label>
                        <input id="editEmail" type="email" autocomplete="email">
                    </div>
                    <div class="admin-field">
                        <label for="editPhone" data-zh="电话" data-en="Phone">电话</label>
                        <input id="editPhone" type="text" inputmode="tel" autocomplete="tel">
                    </div>
                    <div class="admin-field">
                        <label for="editWechat" data-zh="微信" data-en="WeChat">微信</label>
                        <input id="editWechat" type="text" autocomplete="off">
                    </div>
                    <div class="admin-field">
                        <label for="editQQ" data-zh="QQ" data-en="QQ">QQ</label>
                        <input id="editQQ" type="text" inputmode="numeric" autocomplete="off">
                    </div>
                </div>
                <div class="admin-actions">
                    <button class="admin-save" type="button" id="saveContactBtn" data-zh="保存" data-en="Save">保存</button>
                    <button class="admin-text-button" type="button" id="cancelContactBtn" data-zh="取消" data-en="Cancel">取消</button>
                </div>
                <div class="admin-status" id="contactAdminStatus"></div>
            </div>
        </section>

        <section class="now">
            <div class="section-heading">
                <div class="section-label" data-zh="现在" data-en="NOW">现在</div>
                <button class="admin-button admin-only" type="button" id="editNowBtn" data-zh="编辑" data-en="Edit">编辑</button>
            </div>

            <p class="now-text" id="nowText"></p>

            <div class="admin-panel admin-only" id="nowEditor" hidden>
                <div class="admin-panel-title" data-zh="编辑现在状态" data-en="Edit now status">编辑现在状态</div>
                <div class="admin-grid">
                    <div class="admin-field">
                        <label for="editNowZh">中文</label>
                        <textarea id="editNowZh" maxlength="500"></textarea>
                    </div>
                    <div class="admin-field">
                        <label for="editNowEn">English</label>
                        <textarea id="editNowEn" maxlength="500"></textarea>
                    </div>
                </div>
                <div class="admin-actions">
                    <button class="admin-save" type="button" id="saveNowBtn" data-zh="保存" data-en="Save">保存</button>
                    <button class="admin-text-button" type="button" id="cancelNowBtn" data-zh="取消" data-en="Cancel">取消</button>
                </div>
                <div class="admin-status" id="nowAdminStatus"></div>
            </div>
        </section>

        <section class="guestbook">
            <div class="guestbook-heading">
                <div class="section-label" data-zh="留言" data-en="GUESTBOOK">留言</div>
                <div class="message-count" id="messageCount"></div>
            </div>

            <form class="guestbook-form" id="guestbookForm">
                <input type="text" id="msgAuthor" maxlength="40" required
                    data-zh-placeholder="你的名字" data-en-placeholder="Your name"
                    placeholder="你的名字">

                <textarea id="msgContent" maxlength="500" required
                    data-zh-placeholder="想说点什么..." data-en-placeholder="Say something..."
                    placeholder="想说点什么..."></textarea>

                <div class="hp-field" aria-hidden="true">
                    <label>
                        Website
                        <input type="text" id="websiteField" tabindex="-1" autocomplete="off">
                    </label>
                </div>

                <button type="submit" class="guestbook-submit" id="msgSubmit"
                    data-zh="发送" data-en="SEND">发送</button>

                <div class="guestbook-status" id="msgStatus"></div>
            </form>

            <ul class="messages-list" id="messagesList">
                <li class="messages-loading" data-zh="加载中..." data-en="Loading...">加载中...</li>
            </ul>

            <div class="debug-panel" id="debugPanel" aria-live="polite">
                <div class="debug-title" data-zh="调试信息" data-en="Debug info">调试信息</div>
                <div class="debug-message" id="debugMessage"></div>
            </div>
        </section>

        <div class="footer">© 2026 Hao Luo</div>
    </main>

            if (isAdmin) {
                document.body.classList.add('admin-mode');
            }

            window.addEventListener('error', function (event) {
                const msg = event.message || (event.error && event.error.message) || tr('unknown');
                showDebug('JS error: ' + msg);
            });

            window.addEventListener('unhandledrejection', function (event) {
                const reason = event.reason;
                const msg = reason && reason.message ? reason.message : String(reason || tr('unknown'));
                showDebug('Unhandled promise rejection: ' + msg);
            });

            langBtn.addEventListener('click', function () {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                safeSaveLang(currentLang);
                applyLang();
            });

            form.addEventListener('submit', submitMessage);

            messagesList.addEventListener('click', function (event) {
                const deleteButton = event.target.closest('[data-delete-id]');
                const hideButton = event.target.closest('[data-hide-id]');
                const restoreButton = event.target.closest('[data-restore-id]');

                if (deleteButton) {
                    deleteMessage(deleteButton.getAttribute('data-delete-id'));
                    return;
                }

                if (hideButton) {
                    setMessageVisible(hideButton.getAttribute('data-hide-id'), false);
                    return;
                }

                if (restoreButton) {
                    setMessageVisible(restoreButton.getAttribute('data-restore-id'), true);
                }
            });

            document.addEventListener('click', function (event) {
                const button = event.target.closest('.copy-button');
                if (!button) return;
                copyText(button);
            });

            editContactBtn.addEventListener('click', openContactEditor);
            cancelContactBtn.addEventListener('click', function () {
                contactEditor.hidden = true;
                setAdminStatus(contactAdminStatus, '', false);
            });
            saveContactBtn.addEventListener('click', saveContactsFromEditor);

            editNowBtn.addEventListener('click', openNowEditor);
            cancelNowBtn.addEventListener('click', function () {
                nowEditor.hidden = true;
                setAdminStatus(nowAdminStatus, '', false);
            });
            saveNowBtn.addEventListener('click', saveNowFromEditor);

            applyLang();
            initApp();

            function cloneProfile(profile) {
                return JSON.parse(JSON.stringify(profile));
            }

            function safeReadLang() {
                try {
                    const saved = localStorage.getItem('siteLang');

                    if (saved === 'zh' || saved === 'en') return saved;

                    const browserLang = (navigator.languages && navigator.languages[0]) ||
                        navigator.language ||
                        'zh-CN';

                    return browserLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
                } catch (err) {
                    return 'zh';
                }
            }

            function safeSaveLang(lang) {
                try {
                    localStorage.setItem('siteLang', lang);
                } catch (err) {}
            }

            function tr(key) {
                return (t[key] && t[key][currentLang]) || key;
            }

            function applyLang() {
                document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
                langBtn.textContent = currentLang === 'zh' ? 'EN' : '中';

                document.querySelectorAll('[data-zh][data-en]').forEach(function (el) {
                    el.textContent = el.getAttribute('data-' + currentLang);
                });

                document.querySelectorAll('[data-zh-placeholder][data-en-placeholder]').forEach(function (el) {
                    el.placeholder = el.getAttribute('data-' + currentLang + '-placeholder');
                });

                renderProfile();
                rerenderListState();
            }

            function renderProfile() {
                bioText.textContent = getLangValue(siteProfile.bio, 'bio');
                nowText.textContent = getLangValue(siteProfile.now, 'now');
                renderContacts();
            }

            function getLangValue(valueObject, fieldName) {
                const fallback = DEFAULT_PROFILE[fieldName] || {};
                return (valueObject && valueObject[currentLang]) || fallback[currentLang] || '';
            }

            function renderContacts() {
                const contacts = siteProfile.contacts || DEFAULT_PROFILE.contacts;

                const rows = [
                    { labelZh: '邮箱', labelEn: 'Email', value: contacts.email || '', href: makeEmailHref(contacts.email), copy: contacts.email || '' },
                    { labelZh: '电话', labelEn: 'Phone', value: contacts.phone || '', href: makePhoneHref(contacts.phone), copy: cleanPhone(contacts.phone) || contacts.phone || '' },
                    { labelZh: '微信', labelEn: 'WeChat', value: contacts.wechat || '', href: '', copy: contacts.wechat || '' },
                    { labelZh: 'QQ', labelEn: 'QQ', value: contacts.qq || '', href: '', copy: contacts.qq || '' }
                ];

                contactList.innerHTML = rows.map(function (row) {
                    const label = currentLang === 'zh' ? row.labelZh : row.labelEn;
                    const valueHtml = row.href
                        ? '<a class="contact-value" href="' + escapeHtml(row.href) + '">' + escapeHtml(row.value) + '</a>'
                        : '<span class="contact-value">' + escapeHtml(row.value) + '</span>';

                    return '<li class="contact-item">' +
                        '<span class="contact-label">' + escapeHtml(label) + '</span>' +
                        valueHtml +
                        '<button class="copy-button" type="button" data-copy="' + escapeHtml(row.copy) + '">' + escapeHtml(tr('copy')) + '</button>' +
                    '</li>';
                }).join('');
            }

            function makeEmailHref(email) {
                const value = String(email || '').trim();
                return value ? 'mailto:' + value : '';
            }

            function makePhoneHref(phone) {
                const digits = cleanPhone(phone);
                if (!digits) return '';
                if (digits.length === 11 && digits.charAt(0) === '1') return 'tel:+86' + digits;
                if (String(phone || '').trim().charAt(0) === '+') return 'tel:' + String(phone).replace(/\s+/g, '');
                return 'tel:' + digits;
            }

            function cleanPhone(phone) {
                return String(phone || '').replace(/[^0-9]/g, '');
            }

            async function initApp() {
                setListState({ type: 'loading', message: tr('supabaseLoading') });

                try {
                    await ensureSupabaseLibrary();

                    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                        throw new Error(tr('libraryMissing'));
                    }

                    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                    await loadProfile();
                    await loadMessages();
                } catch (err) {
                    sbClient = null;
                    const message = cleanError(err) || tr('scriptLoadFailed');
                    setListState({ type: 'error', message: tr('supabaseUnavailable') + '\n' + message });
                    showDebug(message);
                }
            }

            async function ensureSupabaseLibrary() {
                if (window.supabase && typeof window.supabase.createClient === 'function') return;

                const errors = [];

                for (const src of SUPABASE_CDN_URLS) {
                    try {
                        await loadScript(src, SCRIPT_LOAD_TIMEOUT_MS);

                        if (window.supabase && typeof window.supabase.createClient === 'function') {
                            return;
                        }

                        errors.push(src + ': ' + tr('libraryMissing'));
                    } catch (err) {
                        errors.push(src + ': ' + cleanError(err));
                    }
                }

                throw new Error(errors.join('\n'));
            }

            function loadScript(src, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    const script = document.createElement('script');
                    let settled = false;

                    const timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        script.remove();
                        reject(new Error(tr('scriptTimeout')));
                    }, timeoutMs);

                    script.src = src;
                    script.async = true;

                    script.onload = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        resolve();
                    };

                    script.onerror = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        reject(new Error(tr('scriptLoadFailed')));
                    };

                    document.head.appendChild(script);
                });
            }

            async function loadProfile() {
                if (!sbClient) return;

                try {
                    const query = sbClient
                        .from('site_settings')
                        .select('value')
                        .eq('key', PROFILE_SETTING_KEY)
                        .maybeSingle();

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    if (result.data && result.data.value) {
                        siteProfile = normalizeProfile(result.data.value);
                        renderProfile();
                    }
                } catch (err) {
                    const message = cleanError(err);
                    showDebug(tr('profileLoadFailed') + message);
                }
            }

            function normalizeProfile(value) {
                const next = cloneProfile(DEFAULT_PROFILE);

                if (value && value.bio) {
                    next.bio.zh = String(value.bio.zh || next.bio.zh);
                    next.bio.en = String(value.bio.en || next.bio.en);
                }

                if (value && value.now) {
                    next.now.zh = String(value.now.zh || next.now.zh);
                    next.now.en = String(value.now.en || next.now.en);
                }

                if (value && value.contacts) {
                    next.contacts.email = String(value.contacts.email || next.contacts.email);
                    next.contacts.phone = String(value.contacts.phone || next.contacts.phone);
                    next.contacts.wechat = String(value.contacts.wechat || next.contacts.wechat);
                    next.contacts.qq = String(value.contacts.qq || next.contacts.qq);
                }

                return next;
            }

            function openContactEditor() {
                editEmail.value = siteProfile.contacts.email || '';
                editPhone.value = siteProfile.contacts.phone || '';
                editWechat.value = siteProfile.contacts.wechat || '';
                editQQ.value = siteProfile.contacts.qq || '';
                contactEditor.hidden = false;
                setAdminStatus(contactAdminStatus, '', false);
            }

            async function saveContactsFromEditor() {
                const previous = cloneProfile(siteProfile);

                siteProfile.contacts.email = editEmail.value.trim();
                siteProfile.contacts.phone = editPhone.value.trim();
                siteProfile.contacts.wechat = editWechat.value.trim();
                siteProfile.contacts.qq = editQQ.value.trim();

                renderProfile();

                const ok = await saveProfile(contactAdminStatus, saveContactBtn);
                if (ok) {
                    contactEditor.hidden = true;
                } else {
                    siteProfile = previous;
                    renderProfile();
                }
            }

            function openNowEditor() {
                editNowZh.value = siteProfile.now.zh || '';
                editNowEn.value = siteProfile.now.en || '';
                nowEditor.hidden = false;
                setAdminStatus(nowAdminStatus, '', false);
            }

            async function saveNowFromEditor() {
                const previous = cloneProfile(siteProfile);

                siteProfile.now.zh = editNowZh.value.trim();
                siteProfile.now.en = editNowEn.value.trim();

                if (!siteProfile.now.zh) siteProfile.now.zh = DEFAULT_PROFILE.now.zh;
                if (!siteProfile.now.en) siteProfile.now.en = DEFAULT_PROFILE.now.en;

                renderProfile();

                const ok = await saveProfile(nowAdminStatus, saveNowBtn);
                if (ok) {
                    nowEditor.hidden = true;
                } else {
                    siteProfile = previous;
                    renderProfile();
                }
            }

            async function saveProfile(statusNode, buttonNode) {
                if (!sbClient) {
                    setAdminStatus(statusNode, tr('adminUnavailable'), true);
                    showDebug(tr('adminUnavailable'));
                    return false;
                }

                buttonNode.disabled = true;
                setAdminStatus(statusNode, tr('saving'), false);

                try {
                    const query = sbClient.rpc('update_site_setting_with_admin', {
                        setting_key: PROFILE_SETTING_KEY,
                        setting_value: siteProfile,
                        admin_password: adminPasswordFromUrl
                    });

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    if (result.data !== true) {
                        throw new Error(tr('wrongPassword'));
                    }

                    setAdminStatus(statusNode, tr('saved'), false);
                    return true;
                } catch (err) {
                    const message = cleanError(err);
                    setAdminStatus(statusNode, tr('saveFailed') + message, true);
                    showDebug('Save profile failed: ' + message);
                    return false;
                } finally {
                    buttonNode.disabled = false;
                }
            }

            function setAdminStatus(node, message, isError) {
                if (!node) return;
                node.textContent = message;
                node.classList.toggle('error', Boolean(isError));
            }

            async function loadMessages() {
                if (!sbClient) {
                    setListState({ type: 'error', message: tr('systemUnavailable') });
                    return;
                }

                setListState({ type: 'loading', message: tr('loading') });

                try {
                    let result;

                    if (isAdmin) {
                        result = await withTimeout(
                            sbClient.rpc('get_messages_with_admin', {
                                admin_password: adminPasswordFromUrl
                            }),
                            SUPABASE_QUERY_TIMEOUT_MS
                        );
                    } else {
                        result = await withTimeout(
                            sbClient
                                .from('messages')
                                .select('*')
                                .order('created_at', { ascending: false })
                                .limit(50),
                            SUPABASE_QUERY_TIMEOUT_MS
                        );
                    }

                    if (result.error) throw result.error;

                    setListState({ type: 'messages', messages: result.data || [] });
                } catch (err) {
                    const message = cleanError(err);
                    setListState({ type: 'error', message: tr('loadFailed') + message });
                    showDebug('Load messages failed: ' + message);
                }
            }

            async function submitMessage(event) {
                event.preventDefault();

                if (!sbClient) {
                    setStatus(tr('systemUnavailable'), true);
                    showDebug(tr('systemUnavailable'));
                    return;
                }

                const author = inputAuthor.value.trim();
                const content = inputContent.value.trim();
                const honeypot = websiteField.value.trim();

                if (!author || !content) return;

                const spamCheck = checkSpam(content, honeypot);

                if (!spamCheck.ok) {
                    if (spamCheck.silent) {
                        inputAuthor.value = '';
                        inputContent.value = '';
                        websiteField.value = '';
                        setStatus(tr('sent'), false);
                    } else {
                        setStatus(spamCheck.message, true);
                    }
                    return;
                }

                submitBtn.disabled = true;
                setStatus(tr('sending'), false);

                try {
                    const query = sbClient
                        .from('messages')
                        .insert({ author: author, content: content, visible: true });

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    inputAuthor.value = '';
                    inputContent.value = '';
                    websiteField.value = '';

                    setStatus(tr('sent'), false);

                    setTimeout(function () {
                        setStatus('', false);
                    }, 2500);

                    await loadMessages();
                } catch (err) {
                    const message = cleanError(err);
                    setStatus(tr('sendFailed') + message, true);
                    showDebug('Submit message failed: ' + message);
                } finally {
                    submitBtn.disabled = false;
                }
            }

            function checkSpam(content, honeypot) {
                if (honeypot) {
                    return { ok: false, silent: true };
                }

                if (Date.now() - pageLoadedAt < MIN_SUBMIT_WAIT_MS) {
                    return { ok: false, message: tr('tooFast') };
                }

                const links = content.match(/https?:\/\/|www\./gi) || [];
                if (links.length > 2) {
                    return { ok: false, message: tr('tooManyLinks') };
                }

                const blockedWords = [
                    'casino',
                    'porn',
                    'viagra',
                    'crypto giveaway',
                    'free money',
                    '바카라',
                    '카지노'
                ];

                const lower = content.toLowerCase();
                const hasBlockedWord = blockedWords.some(function (word) {
                    return lower.indexOf(word) !== -1;
                });

                if (hasBlockedWord) {
                    return { ok: false, message: tr('blockedWords') };
                }

                return { ok: true };
            }

            async function setMessageVisible(id, visible) {
                if (!sbClient) {
                    setStatus(tr('systemUnavailable'), true);
                    showDebug(tr('systemUnavailable'));
                    return;
                }

                const confirmText = visible ? tr('restoreConfirm') : tr('hideConfirm');
                if (!window.confirm(confirmText)) return;

                setStatus(visible ? tr('restoreText') + '...' : tr('hideText') + '...', false);

                try {
                    const result = await withTimeout(
                        sbClient.rpc('set_message_visible_with_admin', {
                            msg_id: Number(id),
                            msg_visible: Boolean(visible),
                            admin_password: adminPasswordFromUrl
                        }),
                        SUPABASE_QUERY_TIMEOUT_MS
                    );

                    if (result.error) throw result.error;

                    if (result.data !== true) {
                        throw new Error(tr('wrongPassword'));
                    }

                    setStatus('', false);
                    await loadMessages();
                } catch (err) {
                    const message = cleanError(err);
                    setStatus(tr('visibilityFailed') + message, true);
                    showDebug('Set message visibility failed: ' + message);
                }
            }

            async function deleteMessage(id) {
                if (!sbClient) {
                    setStatus(tr('systemUnavailable'), true);
                    showDebug(tr('systemUnavailable'));
                    return;
                }

                if (!window.confirm(tr('deleteConfirm'))) return;

                try {
                    const query = sbClient.rpc('delete_message_with_admin', {
                        msg_id: Number(id),
                        admin_password: adminPasswordFromUrl
                    });

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    if (result.data === true) {
                        await loadMessages();
                    } else {
                        setStatus(tr('wrongPassword'), true);
                        showDebug(tr('wrongPassword'));
                    }
                } catch (err) {
                    const message = cleanError(err);
                    setStatus(tr('deleteFailed') + message, true);
                    showDebug('Delete message failed: ' + message);
                }
            }

            function withTimeout(promiseLike, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    const timer = setTimeout(function () {
                        reject(new Error(tr('requestTimeout')));
                    }, timeoutMs);

                    Promise.resolve(promiseLike)
                        .then(function (value) {
                            clearTimeout(timer);
                            resolve(value);
                        })
                        .catch(function (err) {
                            clearTimeout(timer);
                            reject(err);
                        });
                });
            }

            async function copyText(button) {
                const value = button.getAttribute('data-copy') || '';

                if (!value) return;

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(value);
                    } else {
                        fallbackCopy(value);
                    }

                    button.textContent = tr('copied');

                    setTimeout(function () {
                        button.textContent = tr('copy');
                    }, 1400);
                } catch (err) {
                    showDebug('Copy failed: ' + cleanError(err));
                }
            }

            function fallbackCopy(value) {
                const textarea = document.createElement('textarea');
                textarea.value = value;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.top = '-9999px';
                textarea.style.left = '-9999px';

                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();

                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);

                if (!ok) {
                    throw new Error('document.execCommand("copy") failed');
                }
            }

            function setStatus(message, isError) {
                statusEl.textContent = message;
                statusEl.classList.toggle('error', Boolean(isError));
            }

            function setListState(nextState) {
                listState = nextState;
                rerenderListState();
            }

            function rerenderListState() {
                if (!messagesList || !listState) return;

                if (listState.type === 'messages') {
                    renderMessages(listState.messages || []);
                    updateMessageCount(listState.messages ? listState.messages.length : 0, listState.messages || []);
                    return;
                }

                if (listState.type === 'loading') {
                    updateMessageCount(null, []);
                    messagesList.innerHTML =
                        '<li class="messages-loading">' +
                        escapeHtml(listState.message || tr('loading')) +
                        '</li>';
                    return;
                }

                if (listState.type === 'error') {
                    updateMessageCount(null, []);
                    messagesList.innerHTML =
                        '<li class="messages-error">' +
                        escapeHtml(listState.message || tr('supabaseUnavailable')) +
                        '</li>';
                }
            }

            function renderMessages(messages) {
                updateMessageCount(messages.length, messages);

                if (!messages || messages.length === 0) {
                    messagesList.innerHTML =
                        '<li class="messages-empty">' +
                        escapeHtml(tr('noMessages')) +
                        '</li>';
                    return;
                }

                messagesList.innerHTML = messages.map(function (msg) {
                    const isHidden = msg.visible === false;

                    const hiddenBadge = isAdmin && isHidden
                        ? '<span class="message-hidden-badge">' + escapeHtml(tr('hiddenBadge')) + '</span>'
                        : '';

                    const visibilityButton = isAdmin
                        ? (
                            isHidden
                                ? '<button class="message-visibility" type="button" data-restore-id="' + escapeHtml(String(msg.id)) + '">' + escapeHtml(tr('restoreText')) + '</button>'
                                : '<button class="message-visibility" type="button" data-hide-id="' + escapeHtml(String(msg.id)) + '">' + escapeHtml(tr('hideText')) + '</button>'
                        )
                        : '';

                    const deleteButton = isAdmin
                        ? '<button class="message-delete" type="button" data-delete-id="' +
                          escapeHtml(String(msg.id)) +
                          '">' +
                          escapeHtml(tr('deleteText')) +
                          '</button>'
                        : '';

                    const actions = isAdmin
                        ? '<span class="message-actions">' + visibilityButton + deleteButton + '</span>'
                        : '';

                    return '<li class="message' + (isHidden ? ' is-hidden' : '') + '">' +
                        '<div class="message-header">' +
                            '<span class="message-author">' + escapeHtml(msg.author || '') + '</span>' +
                            '<span class="message-time">' + escapeHtml(formatTime(msg.created_at)) + '</span>' +
                            hiddenBadge +
                            actions +
                        '</div>' +
                        '<div class="message-content">' + escapeHtml(msg.content || '') + '</div>' +
                    '</li>';
                }).join('');
            }

            function updateMessageCount(count, messages) {
                if (!messageCount) return;

                if (typeof count !== 'number') {
                    messageCount.textContent = '';
                    return;
                }

                if (isAdmin && Array.isArray(messages)) {
                    const hidden = messages.filter(function (msg) {
                        return msg.visible === false;
                    }).length;
                    const visible = count - hidden;

                    if (currentLang === 'zh') {
                        messageCount.textContent = visible + ' 可见 · ' + hidden + ' 隐藏';
                    } else {
                        messageCount.textContent = visible + ' visible · ' + hidden + ' hidden';
                    }
                    return;
                }

                if (currentLang === 'zh') {
                    messageCount.textContent = count + ' 条留言';
                    return;
                }

                if (count === 1) {
                    messageCount.textContent = tr('oneMessage');
                } else {
                    messageCount.textContent = count + ' ' + tr('messageCount');
                }
            }

            function formatTime(isoString) {
                const date = new Date(isoString);

                if (Number.isNaN(date.getTime())) return '';

                const diffMs = Date.now() - date.getTime();
                const minutes = Math.floor(diffMs / 60000);
                const hours = Math.floor(diffMs / 3600000);
                const days = Math.floor(diffMs / 86400000);

                if (currentLang === 'zh') {
                    if (minutes < 1) return tr('justNow');
                    if (minutes < 60) return minutes + ' 分钟前';
                    if (hours < 24) return hours + ' 小时前';
                    if (days < 7) return days + ' 天前';
                    return (date.getMonth() + 1) + '月' + date.getDate() + '日';
                }

                if (minutes < 1) return tr('justNow');
                if (minutes < 60) return minutes + 'm ago';
                if (hours < 24) return hours + 'h ago';
                if (days < 7) return days + 'd ago';

                return date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric'
                });
            }

            function cleanError(err) {
                if (!err) return tr('unknown');
                if (typeof err === 'string') return err;
                if (err.message) return err.message;

                try {
                    return JSON.stringify(err);
                } catch (jsonErr) {
                    return String(err);
                }
            }

            function showDebug(message) {
                if (!debugPanel || !debugMessage) return;

                debugPanel.classList.add('is-visible');
                debugMessage.textContent = message;
            }

            function escapeHtml(value) {
                const div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            }
        })();
    </script>
</body>
