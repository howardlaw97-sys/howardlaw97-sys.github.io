<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hao Luo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fdfdfd;
            --fg: #111;
            --muted: #888;
            --line: #e5e5e5;
            --error: #c33;
        }

        html, body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        .lang-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            z-index: 10;
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-family: inherit;
            font-weight: 500;
        }

        .lang-switch:hover,
        .lang-switch:focus {
            color: var(--fg);
            border-color: var(--fg);
            outline: none;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 130px 32px 80px;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .name {
            font-size: 44px;
            font-weight: 300;
            letter-spacing: -0.8px;
            margin-bottom: 28px;
        }

        .divider {
            width: 36px;
            height: 1px;
            background: var(--fg);
            margin-bottom: 36px;
        }

        .bio {
            font-size: 16px;
            line-height: 1.85;
            margin-bottom: 72px;
            color: #2a2a2a;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 22px;
            font-weight: 500;
        }

        html[lang="zh-CN"] .section-label {
            letter-spacing: 0.3px;
            font-size: 12px;
        }

        .contact-list {
            list-style: none;
        }

        .contact-item {
            display: grid;
            grid-template-columns: 88px minmax(0, 1fr) auto;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            align-items: baseline;
        }

        .contact-label {
            color: var(--muted);
            font-size: 13px;
        }

        .contact-value {
            color: var(--fg);
            text-decoration: none;
            font-variant-numeric: tabular-nums;
            word-break: break-word;
        }

        a.contact-value {
            transition: color 0.25s ease;
        }

        a.contact-value:hover {
            color: var(--muted);
        }

        .copy-button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            padding: 2px 0;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        html[lang="zh-CN"] .copy-button {
            font-size: 12px;
        }

        .copy-button:hover {
            color: var(--fg);
        }

        .now {
            margin-top: 72px;
        }

        .now-text {
            font-size: 15px;
            line-height: 1.85;
            color: #2a2a2a;
        }

        .guestbook {
            margin-top: 80px;
        }

        .guestbook-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .guestbook-heading .section-label {
            margin-bottom: 0;
        }

        .message-count {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }

        .guestbook-form {
            margin-bottom: 56px;
        }

        .guestbook-form input,
        .guestbook-form textarea {
            display: block;
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--line);
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--fg);
            outline: none;
            resize: none;
            transition: border-color 0.25s ease;
        }

        .guestbook-form input:focus,
        .guestbook-form textarea:focus {
            border-bottom-color: var(--fg);
        }

        .guestbook-form input::placeholder,
        .guestbook-form textarea::placeholder {
            color: var(--muted);
        }

        .guestbook-form textarea {
            min-height: 64px;
            margin-top: 8px;
            line-height: 1.6;
        }

        .guestbook-submit {
            margin-top: 20px;
            padding: 9px 22px;
            background: var(--fg);
            color: var(--bg);
            border: none;
            border-radius: 999px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        html[lang="zh-CN"] .guestbook-submit {
            letter-spacing: 0.5px;
            font-size: 13px;
        }

        .guestbook-submit:hover {
            opacity: 0.85;
        }

        .guestbook-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .guestbook-status {
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
            min-height: 1em;
        }

        .guestbook-status.error {
            color: var(--error);
        }

        .messages-list {
            list-style: none;
        }

        .message {
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .message-author {
            font-size: 14px;
            font-weight: 500;
            color: var(--fg);
        }

        .message-time {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.3px;
            font-variant-numeric: tabular-nums;
        }

        .message-delete {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 11px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        html[lang="zh-CN"] .message-delete {
            font-size: 12px;
        }

        .message-delete:hover {
            color: var(--error);
            background: rgba(204, 51, 51, 0.06);
        }

        .message-content {
            font-size: 14px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .messages-empty,
        .messages-loading,
        .messages-error {
            padding: 24px 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .messages-error {
            color: var(--error);
            letter-spacing: 0;
            text-align: left;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .debug-panel {
            display: none;
            margin-top: 28px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 12px;
            color: var(--muted);
            word-break: break-word;
        }

        .debug-panel.is-visible {
            display: block;
        }

        .debug-title {
            color: var(--fg);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .debug-message {
            color: var(--error);
            white-space: pre-wrap;
        }

        .hp-field {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            overflow: hidden;
        }

        .footer {
            margin-top: 96px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 100px 24px 60px;
            }

            .name {
                font-size: 34px;
            }

            .bio {
                font-size: 15px;
                margin-bottom: 56px;
            }

            .contact-item {
                grid-template-columns: 72px minmax(0, 1fr) auto;
                gap: 12px;
                font-size: 14px;
            }

            .lang-switch {
                top: 20px;
                right: 20px;
                padding: 6px 12px;
            }

            .guestbook {
                margin-top: 64px;
            }

            .now {
                margin-top: 64px;
            }
        }
    </style>
</head>
<body>
    <button class="lang-switch" type="button" id="langBtn">EN</button>

    <main class="container">
        <h1 class="name">Hao Luo</h1>
        <div class="divider"></div>

               data-en="Currently refining my personal website, while continuing to practice English writing, information organization, and AI tools.">
                正在完善自己的个人网站,也持续练习英文写作、信息整理和 AI 工具使用。

        <section class="guestbook">

            <form class="guestbook-form" id="guestbookForm">

    <script>
        (function () {
            'use strict';

            const SUPABASE_URL = 'https://wzbqabzlmfassgmyyowj.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_fbPvPbTmOfum_628MVQE-w_i6-dlorB';

            const SUPABASE_CDN_URLS = [
                'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js',
                'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
            ];

            const SCRIPT_LOAD_TIMEOUT_MS = 10000;
            const SUPABASE_QUERY_TIMEOUT_MS = 15000;
            const MIN_SUBMIT_WAIT_MS = 2500;

            const pageLoadedAt = Date.now();

            const urlParams = new URLSearchParams(window.location.search);
            const adminPasswordFromUrl = urlParams.get('admin') || '';
            const isAdmin = adminPasswordFromUrl.length > 0;

            let currentLang = safeReadLang();
            let sbClient = null;
            let listState = { type: 'loading' };

            const langBtn = document.getElementById('langBtn');
            const messagesList = document.getElementById('messagesList');
            const messageCount = document.getElementById('messageCount');
            const form = document.getElementById('guestbookForm');
            const inputAuthor = document.getElementById('msgAuthor');
            const inputContent = document.getElementById('msgContent');
            const websiteField = document.getElementById('websiteField');
            const submitBtn = document.getElementById('msgSubmit');
            const statusEl = document.getElementById('msgStatus');
            const debugPanel = document.getElementById('debugPanel');
            const debugMessage = document.getElementById('debugMessage');

            const t = {
                loading: { zh: '加载中...', en: 'Loading...' },
                noMessages: { zh: '还没有留言,留下第一条吧', en: 'No messages yet. Be the first.' },
                supabaseLoading: { zh: '正在连接留言系统...', en: 'Connecting to guestbook...' },
                supabaseUnavailable: { zh: '留言系统暂时不可用,但页面其他功能可以正常使用。', en: 'Guestbook is temporarily unavailable, but the rest of the page still works.' },
                loadFailed: { zh: '留言加载失败: ', en: 'Failed to load messages: ' },
                sendFailed: { zh: '发送失败: ', en: 'Failed to send: ' },
                deleteFailed: { zh: '删除失败: ', en: 'Delete failed: ' },
                sending: { zh: '发送中...', en: 'Sending...' },
                sent: { zh: '已发送 ✓', en: 'Sent ✓' },
                copied: { zh: '已复制', en: 'Copied' },
                copy: { zh: '复制', en: 'Copy' },
                systemUnavailable: { zh: '留言系统未连接。请稍后再试。', en: 'Guestbook is not connected. Please try again later.' },
                deleteConfirm: { zh: '确认删除这条留言?', en: 'Delete this message?' },
                wrongPassword: { zh: '删除失败: 管理员密码不正确。', en: 'Delete failed: wrong admin password.' },
                deleteText: { zh: '删除', en: 'Delete' },
                scriptLoadFailed: { zh: 'Supabase 前端库加载失败。常见原因: CDN 被网络/VPN 拦截。', en: 'Supabase frontend library failed to load. Common cause: CDN blocked by network/VPN.' },
                scriptTimeout: { zh: 'Supabase 前端库加载超时。', en: 'Supabase frontend library load timed out.' },
                requestTimeout: { zh: '请求 Supabase 超时。可能是网络、VPN 或 Supabase 连接问题。', en: 'Supabase request timed out. This may be a network, VPN, or Supabase connection issue.' },
                libraryMissing: { zh: 'window.supabase.createClient 不存在。可能是 CDN 文件未正确加载。', en: 'window.supabase.createClient is missing. The CDN file may not have loaded correctly.' },
                tooFast: { zh: '请稍等几秒后再发送。', en: 'Please wait a few seconds before sending.' },
                tooManyLinks: { zh: '留言里链接太多,请减少链接后再发送。', en: 'Too many links. Please remove some links and try again.' },
                blockedWords: { zh: '留言内容看起来像垃圾信息,请修改后再发送。', en: 'This message looks like spam. Please edit it and try again.' },
                messageCount: { zh: '条留言', en: 'messages' },
                oneMessage: { zh: '1 条留言', en: '1 message' },
                unknown: { zh: '未知错误', en: 'Unknown error' },
                justNow: { zh: '刚刚', en: 'just now' }
            };

            window.addEventListener('error', function (event) {
                const msg = event.message || (event.error && event.error.message) || tr('unknown');
                showDebug('JS error: ' + msg);
            });

            window.addEventListener('unhandledrejection', function (event) {
                const reason = event.reason;
                const msg = reason && reason.message ? reason.message : String(reason || tr('unknown'));
                showDebug('Unhandled promise rejection: ' + msg);
            });

            langBtn.addEventListener('click', function () {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                safeSaveLang(currentLang);
                applyLang();
            });

            form.addEventListener('submit', submitMessage);

            messagesList.addEventListener('click', function (event) {
                const button = event.target.closest('[data-delete-id]');
                if (!button) return;
                deleteMessage(button.getAttribute('data-delete-id'));
            });

            document.addEventListener('click', function (event) {
                const button = event.target.closest('.copy-button');
                if (!button) return;
                copyText(button);
            });

            applyLang();
            initGuestbook();

            function safeReadLang() {
                try {
                    const saved = localStorage.getItem('siteLang');

                    if (saved === 'zh' || saved === 'en') {
                        return saved;
                    }

                    const browserLang = (navigator.languages && navigator.languages[0]) ||
                        navigator.language ||
                        'zh-CN';

                    return browserLang.toLowerCase().startsWith('zh') ? 'zh' : 'en';
                } catch (err) {
                    return 'zh';
                }
            }

            function safeSaveLang(lang) {
                try {
                    localStorage.setItem('siteLang', lang);
                } catch (err) {}
            }

            function tr(key) {
                return (t[key] && t[key][currentLang]) || key;
            }

            function applyLang() {
                document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
                langBtn.textContent = currentLang === 'zh' ? 'EN' : '中';

                document.querySelectorAll('[data-zh][data-en]').forEach(function (el) {
                    el.textContent = el.getAttribute('data-' + currentLang);
                });

                document.querySelectorAll('[data-zh-placeholder][data-en-placeholder]').forEach(function (el) {
                    el.placeholder = el.getAttribute('data-' + currentLang + '-placeholder');
                });

                rerenderListState();
            }

            async function initGuestbook() {
                setListState({ type: 'loading', message: tr('supabaseLoading') });

                try {
                    await ensureSupabaseLibrary();

                    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
                        throw new Error(tr('libraryMissing'));
                    }

                    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    await loadMessages();
                } catch (err) {
                    sbClient = null;
                    const message = cleanError(err) || tr('scriptLoadFailed');
                    setListState({ type: 'error', message: tr('supabaseUnavailable') + '\n' + message });
                    showDebug(message);
                }
            }

            async function ensureSupabaseLibrary() {
                if (window.supabase && typeof window.supabase.createClient === 'function') return;

                const errors = [];

                for (const src of SUPABASE_CDN_URLS) {
                    try {
                        await loadScript(src, SCRIPT_LOAD_TIMEOUT_MS);

                        if (window.supabase && typeof window.supabase.createClient === 'function') {
                            return;
                        }

                        errors.push(src + ': ' + tr('libraryMissing'));
                    } catch (err) {
                        errors.push(src + ': ' + cleanError(err));
                    }
                }

                throw new Error(errors.join('\n'));
            }

            function loadScript(src, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    const script = document.createElement('script');
                    let settled = false;

                    const timer = setTimeout(function () {
                        if (settled) return;
                        settled = true;
                        script.remove();
                        reject(new Error(tr('scriptTimeout')));
                    }, timeoutMs);

                    script.src = src;
                    script.async = true;

                    script.onload = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        resolve();
                    };

                    script.onerror = function () {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        reject(new Error(tr('scriptLoadFailed')));
                    };

                    document.head.appendChild(script);
                });
            }

            async function loadMessages() {
                if (!sbClient) {
                    setListState({ type: 'error', message: tr('systemUnavailable') });
                    return;
                }

                setListState({ type: 'loading', message: tr('loading') });

                try {
                    const query = sbClient
                        .from('messages')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(50);

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    setListState({ type: 'messages', messages: result.data || [] });
                } catch (err) {
                    const message = cleanError(err);
                    setListState({ type: 'error', message: tr('loadFailed') + message });
                    showDebug('Load messages failed: ' + message);
                }
            }

            async function submitMessage(event) {
                event.preventDefault();

                if (!sbClient) {
                    setStatus(tr('systemUnavailable'), true);
                    showDebug(tr('systemUnavailable'));
                    return;
                }

                const author = inputAuthor.value.trim();
                const content = inputContent.value.trim();
                const honeypot = websiteField.value.trim();

                if (!author || !content) return;

                const spamCheck = checkSpam(content, honeypot);

                if (!spamCheck.ok) {
                    if (spamCheck.silent) {
                        inputAuthor.value = '';
                        inputContent.value = '';
                        websiteField.value = '';
                        setStatus(tr('sent'), false);
                    } else {
                        setStatus(spamCheck.message, true);
                    }
                    return;
                }

                submitBtn.disabled = true;
                setStatus(tr('sending'), false);

                try {
                    const query = sbClient
                        .from('messages')
                        .insert({ author: author, content: content });

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    inputAuthor.value = '';
                    inputContent.value = '';
                    websiteField.value = '';

                    setStatus(tr('sent'), false);

                    setTimeout(function () {
                        setStatus('', false);
                    }, 2500);

                    await loadMessages();
                } catch (err) {
                    const message = cleanError(err);
                    setStatus(tr('sendFailed') + message, true);
                    showDebug('Submit message failed: ' + message);
                } finally {
                    submitBtn.disabled = false;
                }
            }

            function checkSpam(content, honeypot) {
                if (honeypot) {
                    return { ok: false, silent: true };
                }

                if (Date.now() - pageLoadedAt < MIN_SUBMIT_WAIT_MS) {
                    return { ok: false, message: tr('tooFast') };
                }

                const links = content.match(/https?:\/\/|www\./gi) || [];
                if (links.length > 2) {
                    return { ok: false, message: tr('tooManyLinks') };
                }

                const blockedWords = [
                    'casino',
                    'porn',
                    'viagra',
                    'crypto giveaway',
                    'free money',
                    '바카라',
                    '카지노'
                ];

                const lower = content.toLowerCase();
                const hasBlockedWord = blockedWords.some(function (word) {
                    return lower.indexOf(word) !== -1;
                });

                if (hasBlockedWord) {
                    return { ok: false, message: tr('blockedWords') };
                }

                return { ok: true };
            }

            async function deleteMessage(id) {
                if (!sbClient) {
                    setStatus(tr('systemUnavailable'), true);
                    showDebug(tr('systemUnavailable'));
                    return;
                }

                if (!window.confirm(tr('deleteConfirm'))) return;

                try {
                    const query = sbClient.rpc('delete_message_with_admin', {
                        msg_id: Number(id),
                        admin_password: adminPasswordFromUrl
                    });

                    const result = await withTimeout(query, SUPABASE_QUERY_TIMEOUT_MS);

                    if (result.error) throw result.error;

                    if (result.data === true) {
                        await loadMessages();
                    } else {
                        setStatus(tr('wrongPassword'), true);
                        showDebug(tr('wrongPassword'));
                    }
                } catch (err) {
                    const message = cleanError(err);
                    setStatus(tr('deleteFailed') + message, true);
                    showDebug('Delete message failed: ' + message);
                }
            }

            function withTimeout(promiseLike, timeoutMs) {
                return new Promise(function (resolve, reject) {
                    const timer = setTimeout(function () {
                        reject(new Error(tr('requestTimeout')));
                    }, timeoutMs);

                    Promise.resolve(promiseLike)
                        .then(function (value) {
                            clearTimeout(timer);
                            resolve(value);
                        })
                        .catch(function (err) {
                            clearTimeout(timer);
                            reject(err);
                        });
                });
            }

            async function copyText(button) {
                const value = button.getAttribute('data-copy') || '';

                if (!value) return;

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(value);
                    } else {
                        fallbackCopy(value);
                    }

                    button.textContent = tr('copied');

                    setTimeout(function () {
                        button.textContent = tr('copy');
                    }, 1400);
                } catch (err) {
                    showDebug('Copy failed: ' + cleanError(err));
                }
            }

            function fallbackCopy(value) {
                const textarea = document.createElement('textarea');
                textarea.value = value;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.top = '-9999px';
                textarea.style.left = '-9999px';

                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();

                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);

                if (!ok) {
                    throw new Error('document.execCommand("copy") failed');
                }
            }

            function setStatus(message, isError) {
                statusEl.textContent = message;
                statusEl.classList.toggle('error', Boolean(isError));
            }

            function setListState(nextState) {
                listState = nextState;
                rerenderListState();
            }

            function rerenderListState() {
                if (!messagesList || !listState) return;

                if (listState.type === 'messages') {
                    renderMessages(listState.messages || []);
                    updateMessageCount(listState.messages ? listState.messages.length : 0);
                    return;
                }

                if (listState.type === 'loading') {
                    updateMessageCount(null);

                    messagesList.innerHTML =
                        '<li class="messages-loading">' +
                        escapeHtml(listState.message || tr('loading')) +
                        '</li>';
                    return;
                }

                if (listState.type === 'error') {
                    updateMessageCount(null);

                    messagesList.innerHTML =
                        '<li class="messages-error">' +
                        escapeHtml(listState.message || tr('supabaseUnavailable')) +
                        '</li>';
                }
            }

            function renderMessages(messages) {
                updateMessageCount(messages.length);

                if (!messages || messages.length === 0) {
                    messagesList.innerHTML =
                        '<li class="messages-empty">' +
                        escapeHtml(tr('noMessages')) +
                        '</li>';
                    return;
                }

                messagesList.innerHTML = messages.map(function (msg) {
                    const deleteButton = isAdmin
                        ? '<button class="message-delete" type="button" data-delete-id="' +
                          escapeHtml(String(msg.id)) +
                          '">' +
                          escapeHtml(tr('deleteText')) +
                          '</button>'
                        : '';

                    return '<li class="message">' +
                        '<div class="message-header">' +
                            '<span class="message-author">' + escapeHtml(msg.author || '') + '</span>' +
                            '<span class="message-time">' + escapeHtml(formatTime(msg.created_at)) + '</span>' +
                            deleteButton +
                        '</div>' +
                        '<div class="message-content">' + escapeHtml(msg.content || '') + '</div>' +
                    '</li>';
                }).join('');
            }

            function updateMessageCount(count) {
                if (!messageCount) return;

                if (typeof count !== 'number') {
                    messageCount.textContent = '';
                    return;
                }

                if (currentLang === 'zh') {
                    messageCount.textContent = count + ' 条留言';
                    return;
                }

                if (count === 1) {
                    messageCount.textContent = tr('oneMessage');
                } else {
                    messageCount.textContent = count + ' ' + tr('messageCount');
                }
            }

            function formatTime(isoString) {
                const date = new Date(isoString);

                if (Number.isNaN(date.getTime())) return '';

                const diffMs = Date.now() - date.getTime();
                const minutes = Math.floor(diffMs / 60000);
                const hours = Math.floor(diffMs / 3600000);
                const days = Math.floor(diffMs / 86400000);

                if (currentLang === 'zh') {
                    if (minutes < 1) return tr('justNow');
                    if (minutes < 60) return minutes + ' 分钟前';
                    if (hours < 24) return hours + ' 小时前';
                    if (days < 7) return days + ' 天前';
                    return (date.getMonth() + 1) + '月' + date.getDate() + '日';
                }

                if (minutes < 1) return tr('justNow');
                if (minutes < 60) return minutes + 'm ago';
                if (hours < 24) return hours + 'h ago';
                if (days < 7) return days + 'd ago';

                return date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric'
                });
            }

            function cleanError(err) {
                if (!err) return tr('unknown');
                if (typeof err === 'string') return err;
                if (err.message) return err.message;

                try {
                    return JSON.stringify(err);
                } catch (jsonErr) {
                    return String(err);
                }
            }

            function showDebug(message) {
                if (!debugPanel || !debugMessage) return;

                debugPanel.classList.add('is-visible');
                debugMessage.textContent = message;
            }

            function escapeHtml(value) {
                const div = document.createElement('div');
                div.textContent = value == null ? '' : String(value);
                return div.innerHTML;
            }
        })();
    </script>
</body>
</html>
