<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hao Luo | 个人主页</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --soft: #999999;
      --line: #e8e8e8;
      --panel: #fafafa;
      --danger: #b00020;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      letter-spacing: 0.01em;
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid var(--fg);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      appearance: none;
      border: 1px solid var(--fg);
      background: var(--bg);
      color: var(--fg);
      border-radius: 999px;
      padding: 7px 13px;
      cursor: pointer;
      line-height: 1.2;
    }

    button:hover {
      background: var(--fg);
      color: var(--bg);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--fg);
      color: var(--bg);
    }

    button.primary:hover {
      background: var(--bg);
      color: var(--fg);
    }

    button.textButton {
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      color: var(--fg);
      border-bottom: 1px solid var(--fg);
    }

    button.textButton:hover {
      background: transparent;
      color: var(--muted);
      border-bottom-color: var(--muted);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      background: var(--bg);
      color: var(--fg);
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--fg);
    }

    label {
      display: block;
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    label span {
      display: block;
      margin: 0 0 6px;
    }

    [hidden],
    .hidden {
      display: none !important;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 30px 18px 56px;
    }

    .siteHeader {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 10px 0 34px;
    }

    .brand {
      margin: 0;
      font-size: clamp(44px, 17vw, 94px);
      line-height: 0.9;
      letter-spacing: -0.07em;
      font-weight: 800;
    }

    .subtitle {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 5vw, 28px);
      line-height: 1.4;
      letter-spacing: 0.03em;
    }

    .topActions {
      flex: 0 0 auto;
      padding-top: 2px;
    }

    .section {
      border-top: 1px solid var(--line);
      padding: 28px 0;
    }

    .sectionHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 18px;
    }

    .sectionTitle {
      margin: 0;
      font-size: 13px;
      letter-spacing: 0.18em;
      font-weight: 700;
    }

    .bodyText {
      margin: 0;
      font-size: 18px;
      line-height: 1.75;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 13px;
      color: var(--muted);
    }

    .adminBanner,
    .adminBox {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 13px 14px;
      margin: 0 0 18px;
    }

    .adminBanner {
      font-size: 13px;
      color: var(--muted);
    }

    details.adminBox summary {
      cursor: pointer;
      font-weight: 650;
    }

    .formGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      margin-top: 16px;
    }

    .formActions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .contacts {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .contactItem {
      display: grid;
      grid-template-columns: 82px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    .contactName {
      color: var(--muted);
    }

    .contactValue {
      overflow-wrap: anywhere;
    }

    .statusLine {
      margin: 8px 0 14px;
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .errorText {
      color: var(--danger);
    }

    .updatesList,
    .messageList {
      display: grid;
      gap: 0;
    }

    .updateCard,
    .messageCard {
      border-top: 1px solid var(--line);
      padding: 20px 0;
    }

    .updateCard:first-child,
    .messageCard:first-child {
      border-top: 0;
    }

    .updateCard.isHidden,
    .messageCard.isHidden {
      opacity: 0.62;
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .updateTitle {
      margin: 0 0 10px;
      font-size: 21px;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .updateBody,
    .messageBody {
      margin: 0;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .updateImage {
      display: block;
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-top: 14px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .linkButton {
      display: inline-block;
      margin-top: 14px;
      border: 1px solid var(--fg);
      border-radius: 999px;
      padding: 7px 13px;
      line-height: 1.2;
    }

    .linkButton:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .adminActions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 14px;
      font-size: 13px;
    }

    .messageForm {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .honeypot {
      position: absolute;
      left: -9999px;
      opacity: 0;
      pointer-events: none;
    }

    .debugPanel {
      border-top: 1px solid var(--line);
      margin-top: 20px;
      padding-top: 20px;
    }

    .debugPanel pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 12px;
      color: var(--danger);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      background: var(--fg);
      color: var(--bg);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      z-index: 99;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    @media (min-width: 680px) {
      .page {
        padding-top: 46px;
      }

      .formGrid.two {
        grid-template-columns: 1fr 1fr;
        column-gap: 14px;
      }

      .messageForm {
        grid-template-columns: 170px 1fr auto;
        align-items: start;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="siteHeader">
      <div>
        <h1 class="brand">HAO<br>LUO</h1>
        <p class="subtitle" data-i18n="subtitle">个人主页 / 持续更新</p>
      </div>

      <div class="topActions">
        <button id="langBtn" type="button">EN</button>
      </div>
    </header>

    <main>
      <div id="adminBanner" class="adminBanner" data-admin-only hidden data-i18n="adminMode">
        管理员模式已开启
      </div>

      <section class="section">
        <div class="sectionHeader">
          <h2 class="sectionTitle" data-i18n="aboutTitle">ABOUT</h2>
        </div>

        <p id="bioText" class="bodyText"></p>
        <div id="contactList" class="contacts"></div>
      </section>

      <section class="section">
        <div class="sectionHeader">
          <h2 class="sectionTitle" data-i18n="nowTitle">NOW</h2>
        </div>

        <p id="nowText" class="bodyText"></p>
      </section>

      <details id="adminProfilePanel" class="adminBox" data-admin-only hidden>
        <summary data-i18n="editProfile">编辑个人信息 / 联系方式</summary>

        <form id="profileForm">
          <div class="formGrid two">
            <label>
              <span data-i18n="bioZh">中文简介</span>
              <textarea id="editBioZh"></textarea>
            </label>

            <label>
              <span data-i18n="bioEn">英文简介</span>
              <textarea id="editBioEn"></textarea>
            </label>
          </div>

          <div class="formGrid two">
            <label>
              <span data-i18n="nowZh">中文 Now</span>
              <textarea id="editNowZh"></textarea>
            </label>

            <label>
              <span data-i18n="nowEn">英文 Now</span>
              <textarea id="editNowEn"></textarea>
            </label>
          </div>

          <div class="formGrid two">
            <label>
              <span>Email</span>
              <input id="editEmail" type="text" autocomplete="off" />
            </label>

            <label>
              <span data-i18n="phone">电话</span>
              <input id="editPhone" type="text" autocomplete="off" />
            </label>

            <label>
              <span>WeChat</span>
              <input id="editWechat" type="text" autocomplete="off" />
            </label>

            <label>
              <span>QQ</span>
              <input id="editQq" type="text" autocomplete="off" />
            </label>
          </div>

          <div class="formActions">
            <button id="saveProfileBtn" class="primary" type="submit" data-i18n="save">保存</button>
            <span id="profileSaveStatus" class="small"></span>
          </div>
        </form>
      </details>

      <section class="section" id="updatesSection">
        <div class="sectionHeader">
          <h2 class="sectionTitle" data-i18n="updatesTitle">UPDATES</h2>
          <button id="newUpdateBtn" type="button" data-admin-only hidden data-i18n="newUpdate">新增</button>
        </div>

        <div id="updateEditor" class="adminBox hidden" data-admin-only hidden>
          <h3 id="updateFormTitle" class="sectionTitle" style="margin:0 0 16px;">新增动态</h3>

          <form id="updateForm">
            <div class="formGrid two">
              <label>
                <span data-i18n="updateType">类型</span>
                <select id="updateType">
                  <option value="post">post</option>
                  <option value="note">note</option>
                  <option value="project">project</option>
                  <option value="link">link</option>
                  <option value="image">image</option>
                </select>
              </label>

              <label>
                <span data-i18n="visible">公开显示</span>
                <select id="updateVisible">
                  <option value="true" data-i18n="visibleYes">公开</option>
                  <option value="false" data-i18n="visibleNo">隐藏</option>
                </select>
              </label>
            </div>

            <div class="formGrid two">
              <label>
                <span data-i18n="titleZh">中文标题</span>
                <input id="updateTitleZh" type="text" autocomplete="off" />
              </label>

              <label>
                <span data-i18n="titleEn">英文标题</span>
                <input id="updateTitleEn" type="text" autocomplete="off" />
              </label>
            </div>

            <div class="formGrid two">
              <label>
                <span data-i18n="bodyZh">中文正文</span>
                <textarea id="updateBodyZh"></textarea>
              </label>

              <label>
                <span data-i18n="bodyEn">英文正文</span>
                <textarea id="updateBodyEn"></textarea>
              </label>
            </div>

            <label>
              <span data-i18n="imageUrl">图片 URL，只接受 http / https</span>
              <input id="updateImageUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com/image.jpg" />
            </label>

            <label>
              <span data-i18n="linkUrl">外部链接 URL，只接受 http / https</span>
              <input id="updateLinkUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://example.com" />
            </label>

            <div class="formGrid two">
              <label>
                <span data-i18n="linkLabelZh">中文链接按钮文字</span>
                <input id="updateLinkLabelZh" type="text" autocomplete="off" placeholder="查看" />
              </label>

              <label>
                <span data-i18n="linkLabelEn">英文链接按钮文字</span>
                <input id="updateLinkLabelEn" type="text" autocomplete="off" placeholder="View" />
              </label>
            </div>

            <div class="formActions">
              <button id="saveUpdateBtn" class="primary" type="submit" data-i18n="save">保存</button>
              <button id="cancelUpdateBtn" type="button" data-i18n="cancel">取消</button>
              <span id="updateSaveStatus" class="small"></span>
            </div>
          </form>
        </div>

        <div id="updatesStatus" class="statusLine" data-i18n="loadingUpdates">动态加载中...</div>
        <div id="updatesList" class="updatesList"></div>
      </section>

      <section class="section" id="messagesSection">
        <div class="sectionHeader">
          <h2 class="sectionTitle" data-i18n="messagesTitle">MESSAGES</h2>
        </div>

        <form id="messageForm" class="messageForm">
          <input
            id="messageAuthor"
            type="text"
            maxlength="40"
            autocomplete="name"
            data-i18n-placeholder="namePlaceholder"
            placeholder="你的名字"
          />

          <textarea
            id="messageContent"
            maxlength="500"
            required
            data-i18n-placeholder="messagePlaceholder"
            placeholder="写点什么..."
          ></textarea>

          <input id="messageWebsite" class="honeypot" type="text" autocomplete="off" tabindex="-1" />

          <button id="sendMessageBtn" class="primary" type="submit" data-i18n="send">发布</button>
        </form>

        <div id="messageStatus" class="statusLine" data-i18n="loadingMessages">留言加载中...</div>
        <div id="messageList" class="messageList"></div>
      </section>

      <section id="debugPanel" class="debugPanel hidden">
        <h2 class="sectionTitle">DEBUG</h2>
        <pre id="debugLog"></pre>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

      function escapeHtml(value) {
        return String(value ?? "")

          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")

      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}.${m}.${d}`;
      }

      function showToast(message) {
        const el = $("toast");
        if (!el) return;

        el.textContent = message;
        el.classList.remove("hidden");

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.classList.add("hidden");
        }, 1800);
      }

      function showDebug(message, detail) {
        const panel = $("debugPanel");
        const log = $("debugLog");
        if (!panel || !log) return;

        const time = new Date().toLocaleTimeString();
        const safeDetail = detail ? String(detail) : "";
        log.textContent += `[${time}] ${message}${safeDetail ? "\n" + safeDetail : ""}\n\n`;
        panel.classList.remove("hidden");

        try {
          console.error(message, detail || "");
        } catch (_) {}
      }

      function errorMessage(error) {
        if (!error) return "";
        if (typeof error === "string") return error;
        if (error.message) return error.message;
        try {
          return JSON.stringify(error);
        } catch (_) {
          return String(error);
        }
      }

      function setStatus(id, message, isError) {
        const el = $(id);
        if (!el) return;
        el.textContent = message || "";
        el.classList.toggle("errorText", Boolean(isError));
      }

      function mergeProfile(value) {
        const next = {
          bio: { zh: "", en: "" },
          now: { zh: "", en: "" },
          contacts: { email: "", phone: "", wechat: "", qq: "" }
        };

        const source = value && typeof value === "object" ? value : {};

        next.bio.zh = trimValue(source.bio && source.bio.zh) || profileData.bio.zh || "";
        next.bio.en = trimValue(source.bio && source.bio.en) || profileData.bio.en || "";
        next.now.zh = trimValue(source.now && source.now.zh) || profileData.now.zh || "";
        next.now.en = trimValue(source.now && source.now.en) || profileData.now.en || "";
        next.contacts.email = trimValue(source.contacts && source.contacts.email);
        next.contacts.phone = trimValue(source.contacts && source.contacts.phone);
        next.contacts.wechat = trimValue(source.contacts && source.contacts.wechat);
        next.contacts.qq = trimValue(source.contacts && source.contacts.qq);

        return next;
      }

      function applyLanguage() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.title = t("pageTitle");

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          el.textContent = t(key);
        });

        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          el.setAttribute("placeholder", t(key));
        });

        const langBtn = $("langBtn");
        if (langBtn) {
          langBtn.textContent = lang === "zh" ? "EN" : "中文";
        }

        renderProfile();
        renderUpdates();
        renderMessages();
      }

      function setupAdminView() {
        document.querySelectorAll("[data-admin-only]").forEach((el) => {
          el.hidden = !isAdmin;
        });
      }

      function renderProfile() {
        const bioText = $("bioText");
        const nowText = $("nowText");
        const contactList = $("contactList");

        if (bioText) {
          bioText.innerHTML = nl2br(chooseText(profileData.bio.zh, profileData.bio.en, ""));
        }

        if (nowText) {
          nowText.innerHTML = nl2br(chooseText(profileData.now.zh, profileData.now.en, ""));
        }

        if (contactList) {
          const contacts = [
            ["email", "Email", profileData.contacts.email],
            ["phone", t("phone"), profileData.contacts.phone],
            ["wechat", "WeChat", profileData.contacts.wechat],
            ["qq", "QQ", profileData.contacts.qq]
          ].filter((item) => trimValue(item[2]));

          if (!contacts.length) {
            contactList.innerHTML = `<p class="muted">${escapeHtml(t("noContact"))}</p>`;
          } else {
            contactList.innerHTML = contacts.map(([key, label, value]) => {
              return `
                <div class="contactItem">
                  <span class="contactName">${escapeHtml(label)}</span>
                  <span class="contactValue">${escapeHtml(value)}</span>
                  <button type="button" data-copy="${escapeAttr(value)}">${escapeHtml(t("copy"))}</button>
                </div>
              `;
            }).join("");
          }
        }

        fillProfileEditor();
      }

      function fillProfileEditor() {
        const form = $("profileForm");
        if (!form || form.contains(document.activeElement)) return;

        $("editBioZh").value = profileData.bio.zh || "";
        $("editBioEn").value = profileData.bio.en || "";
        $("editNowZh").value = profileData.now.zh || "";
        $("editNowEn").value = profileData.now.en || "";
        $("editEmail").value = profileData.contacts.email || "";
        $("editPhone").value = profileData.contacts.phone || "";
        $("editWechat").value = profileData.contacts.wechat || "";
        $("editQq").value = profileData.contacts.qq || "";
      }

      function renderUpdates() {
        const list = $("updatesList");
        if (!list) return;

        if (!updatesData.length) {
          list.innerHTML = "";
          setStatus("updatesStatus", t("noUpdates"));
          return;
        }

        setStatus("updatesStatus", t("updateCount").replace("{count}", updatesData.length));

        list.innerHTML = updatesData.map((item) => {
          const visible = item.visible !== false;
          const date = formatDate(item.created_at);
          const title = chooseText(item.title_zh, item.title_en, t("untitledUpdate"));
          const body = chooseText(item.body_zh, item.body_en, "");
          const imageUrl = safeHttpUrl(item.image_url);
          const linkUrl = safeHttpUrl(item.link_url);
          const linkLabel = chooseText(item.link_label_zh, item.link_label_en, t("view"));
          const type = trimValue(item.type || "post");

          return `
            <article class="updateCard ${visible ? "" : "isHidden"}">
              <div class="meta">
                ${date ? `<span>${escapeHtml(date)}</span>` : ""}
                ${type ? `<span>${escapeHtml(type)}</span>` : ""}
                ${isAdmin && !visible ? `<span class="pill">${escapeHtml(t("hidden"))}</span>` : ""}
              </div>

              <h3 class="updateTitle">${escapeHtml(title)}</h3>

              ${body ? `<p class="updateBody">${nl2br(body)}</p>` : ""}

              ${imageUrl ? `<img class="updateImage" src="${escapeAttr(imageUrl)}" alt="" loading="lazy">` : ""}

              ${linkUrl ? `
                <a class="linkButton" href="${escapeAttr(linkUrl)}" target="_blank" rel="noopener noreferrer">
                  ${escapeHtml(linkLabel || t("view"))}
                </a>
              ` : ""}

              ${isAdmin ? `
                <div class="adminActions">
                  <button class="textButton" type="button" data-update-action="edit" data-id="${escapeAttr(item.id)}">${escapeHtml(t("edit"))}</button>
                  <button class="textButton" type="button" data-update-action="${visible ? "hide" : "restore"}" data-id="${escapeAttr(item.id)}">
                    ${escapeHtml(visible ? t("hide") : t("restore"))}
                  </button>
                  <button class="textButton" type="button" data-update-action="delete" data-id="${escapeAttr(item.id)}">${escapeHtml(t("delete"))}</button>
                </div>
              ` : ""}
            </article>
          `;
        }).join("");
      }

      function renderMessages() {
        const list = $("messageList");
        if (!list) return;

        if (!messagesData.length) {
          list.innerHTML = "";
          setStatus("messageStatus", t("noMessages"));
          return;
        }

        setStatus("messageStatus", t("messageCount").replace("{count}", messagesData.length));

        list.innerHTML = messagesData.map((item) => {
          const visible = item.visible !== false;
          const author = trimValue(item.author) || t("anonymous");
          const date = formatDate(item.created_at);
          const content = trimValue(item.content);

          return `
            <article class="messageCard ${visible ? "" : "isHidden"}">
              <div class="meta">
                <span>${escapeHtml(author)}</span>
                ${date ? `<span>${escapeHtml(date)}</span>` : ""}
                ${isAdmin && !visible ? `<span class="pill">${escapeHtml(t("hidden"))}</span>` : ""}
              </div>

              <p class="messageBody">${nl2br(content)}</p>

              ${isAdmin ? `
                <div class="adminActions">
                  <button class="textButton" type="button" data-message-action="${visible ? "hide" : "restore"}" data-id="${escapeAttr(item.id)}">
                    ${escapeHtml(visible ? t("hide") : t("restore"))}
                  </button>
                  <button class="textButton" type="button" data-message-action="delete" data-id="${escapeAttr(item.id)}">${escapeHtml(t("delete"))}</button>
                </div>
              ` : ""}
            </article>
          `;
        }).join("");
      }

      function showUpdateEditor(isEditing) {
        const editor = $("updateEditor");
        const title = $("updateFormTitle");
        if (!editor) return;

        editor.hidden = false;
        editor.classList.remove("hidden");

        if (title) {
          title.textContent = isEditing ? t("updateFormEdit") : t("updateFormNew");
        }

        setStatus("updateSaveStatus", "");
        editor.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function hideUpdateEditor() {
        const editor = $("updateEditor");
        if (!editor) return;

        editor.classList.add("hidden");
        editingUpdateId = null;
        setStatus("updateSaveStatus", "");
      }

      function resetUpdateForm() {
        editingUpdateId = null;

        $("updateType").value = "post";
        $("updateVisible").value = "true";
        $("updateTitleZh").value = "";
        $("updateTitleEn").value = "";
        $("updateBodyZh").value = "";
        $("updateBodyEn").value = "";
        $("updateImageUrl").value = "";
        $("updateLinkUrl").value = "";
        $("updateLinkLabelZh").value = "";
        $("updateLinkLabelEn").value = "";

        showUpdateEditor(false);
      }

      function editUpdate(id) {
        const item = updatesData.find((entry) => String(entry.id) === String(id));
        if (!item) return;

        editingUpdateId = item.id;

        $("updateType").value = item.type || "post";
        $("updateVisible").value = item.visible === false ? "false" : "true";
        $("updateTitleZh").value = item.title_zh || "";
        $("updateTitleEn").value = item.title_en || "";
        $("updateBodyZh").value = item.body_zh || "";
        $("updateBodyEn").value = item.body_en || "";
        $("updateImageUrl").value = item.image_url || "";
        $("updateLinkUrl").value = item.link_url || "";
        $("updateLinkLabelZh").value = item.link_label_zh || "";
        $("updateLinkLabelEn").value = item.link_label_en || "";

        showUpdateEditor(true);
      }

      async function copyText(value) {
        const text = String(value || "");
        if (!text) return;

        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "absolute";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
          }

          showToast(t("copied"));
        } catch (error) {
          showDebug("Copy failed", errorMessage(error));
        }
      }

      async function loadSupabaseScript() {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          return;
        }

        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = SUPABASE_CDN;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Failed to load Supabase CDN"));
          document.head.appendChild(script);
        });
      }

      async function loadProfile() {
        if (!sbClient) return;

        const { data, error } = await sbClient
          .from("site_settings")
          .select("value")
          .eq("key", "profile")
          .maybeSingle();

        if (error) throw error;

        if (data && data.value) {
          profileData = mergeProfile(data.value);
          renderProfile();
        }
      }

      async function saveProfile(event) {
        event.preventDefault();

        if (!sbClient) {
          setStatus("profileSaveStatus", t("supabaseUnavailable"), true);
          return;
        }

        const btn = $("saveProfileBtn");
        btn.disabled = true;
        setStatus("profileSaveStatus", t("saving"));

        const nextProfile = {
          bio: {
            zh: $("editBioZh").value,
            en: $("editBioEn").value
          },
          now: {
            zh: $("editNowZh").value,
            en: $("editNowEn").value
          },
          contacts: {
            email: $("editEmail").value,
            phone: $("editPhone").value,
            wechat: $("editWechat").value,
            qq: $("editQq").value
          }
        };

        try {
          const { error } = await sbClient.rpc("update_site_setting_with_admin", {
            setting_key: "profile",
            setting_value: nextProfile,
            admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          profileData = mergeProfile(nextProfile);
          renderProfile();
          setStatus("profileSaveStatus", t("saved"));
        } catch (error) {
          setStatus("profileSaveStatus", t("actionFailed"), true);
          showDebug("Save profile failed", errorMessage(error));
        } finally {
          btn.disabled = false;
        }
      }

      async function loadUpdates() {
        if (!sbClient) return;

        setStatus("updatesStatus", t("loadingUpdates"));

        let result;

        if (isAdmin) {
          result = await sbClient.rpc("get_updates_with_admin", {
            p_admin_password: adminPasswordFromUrl
          });
        } else {
          result = await sbClient
            .from("updates")
            .select("*")
            .eq("visible", true)
            .order("created_at", { ascending: false })
            .limit(100);
        }

        if (result.error) throw result.error;

        updatesData = Array.isArray(result.data) ? result.data : [];
        renderUpdates();
      }

      async function saveUpdate(event) {
        event.preventDefault();

        if (!sbClient) {
          setStatus("updateSaveStatus", t("supabaseUnavailable"), true);
          return;
        }

        const titleZh = $("updateTitleZh").value;
        const titleEn = $("updateTitleEn").value;
        const bodyZh = $("updateBodyZh").value;
        const bodyEn = $("updateBodyEn").value;
        const imageUrl = $("updateImageUrl").value.trim();
        const linkUrl = $("updateLinkUrl").value.trim();

        const hasAnyContent = [
          titleZh,
          titleEn,
          bodyZh,
          bodyEn,
          imageUrl,
          linkUrl
        ].some((value) => trimValue(value));

        if (!hasAnyContent) {
          setStatus("updateSaveStatus", t("updateRequired"), true);
          return;
        }

        if (imageUrl && !safeHttpUrl(imageUrl)) {
          setStatus("updateSaveStatus", t("invalidUrl"), true);
          return;
        }

        if (linkUrl && !safeHttpUrl(linkUrl)) {
          setStatus("updateSaveStatus", t("invalidUrl"), true);
          return;
        }

        const btn = $("saveUpdateBtn");
        btn.disabled = true;
        setStatus("updateSaveStatus", t("saving"));

        try {
          const { error } = await sbClient.rpc("save_update_with_admin", {
            p_update_id: editingUpdateId,
            p_update_type: $("updateType").value || "post",
            p_title_zh: titleZh,
            p_title_en: titleEn,
            p_body_zh: bodyZh,
            p_body_en: bodyEn,
            p_image_url: imageUrl,
            p_link_url: linkUrl,
            p_link_label_zh: $("updateLinkLabelZh").value,
            p_link_label_en: $("updateLinkLabelEn").value,
            p_visible: $("updateVisible").value === "true",
            p_admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          hideUpdateEditor();
          await loadUpdates();
          showToast(t("updateSaved"));
        } catch (error) {
          setStatus("updateSaveStatus", t("actionFailed"), true);
          showDebug("Save update failed", errorMessage(error));
        } finally {
          btn.disabled = false;
        }
      }

      async function setUpdateVisible(id, visible) {
        if (!sbClient) return;

        try {
          const { error } = await sbClient.rpc("set_update_visible_with_admin", {
            p_update_id: Number(id),
            p_visible: Boolean(visible),
            p_admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          await loadUpdates();
        } catch (error) {
          setStatus("updatesStatus", t("actionFailed"), true);
          showDebug("Set update visible failed", errorMessage(error));
        }
      }

      async function deleteUpdate(id) {
        if (!sbClient) return;
        if (!window.confirm(t("confirmDeleteUpdate"))) return;

        try {
          const { error } = await sbClient.rpc("delete_update_with_admin", {
            p_update_id: Number(id),
            p_admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          await loadUpdates();
        } catch (error) {
          setStatus("updatesStatus", t("actionFailed"), true);
          showDebug("Delete update failed", errorMessage(error));
        }
      }

      async function loadMessages() {
        if (!sbClient) return;

        setStatus("messageStatus", t("loadingMessages"));

        let result;

        if (isAdmin) {
          result = await sbClient.rpc("get_messages_with_admin", {
            admin_password: adminPasswordFromUrl
          });
        } else {
          result = await sbClient
            .from("messages")
            .select("*")
            .eq("visible", true)
            .order("created_at", { ascending: false })
            .limit(50);
        }

        if (result.error) throw result.error;

        messagesData = Array.isArray(result.data) ? result.data : [];
        renderMessages();
      }

      async function sendMessage(event) {
        event.preventDefault();

        if (!sbClient) {
          setStatus("messageStatus", t("supabaseUnavailable"), true);
          return;
        }

        const honeypot = trimValue($("messageWebsite").value);
        if (honeypot) {
          $("messageForm").reset();
          setStatus("messageStatus", t("messageSent"));
          return;
        }

        const author = trimValue($("messageAuthor").value).slice(0, 40) || t("anonymous");
        const content = trimValue($("messageContent").value).slice(0, 500);

        if (content.length < 2) {
          setStatus("messageStatus", t("messageTooShort"), true);
          return;
        }

        const linkCount = (content.match(/https?:\/\//gi) || []).length;
        if (linkCount > 3) {
          setStatus("messageStatus", t("messageTooManyLinks"), true);
          return;
        }

        const btn = $("sendMessageBtn");
        btn.disabled = true;
        btn.textContent = t("sending");

        try {
          const { error } = await sbClient
            .from("messages")
            .insert({
              author,
              content,
              visible: true
            });

          if (error) throw error;

          $("messageForm").reset();
          setStatus("messageStatus", t("messageSent"));
          await loadMessages();
        } catch (error) {
          setStatus("messageStatus", t("actionFailed"), true);
          showDebug("Send message failed", errorMessage(error));
        } finally {
          btn.disabled = false;
          btn.textContent = t("send");
        }
      }

      async function setMessageVisible(id, visible) {
        if (!sbClient) return;

        try {
          const { error } = await sbClient.rpc("set_message_visible_with_admin", {
            msg_id: Number(id),
            msg_visible: Boolean(visible),
            admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          await loadMessages();
        } catch (error) {
          setStatus("messageStatus", t("actionFailed"), true);
          showDebug("Set message visible failed", errorMessage(error));
        }
      }

      async function deleteMessage(id) {
        if (!sbClient) return;
        if (!window.confirm(t("confirmDeleteMessage"))) return;

        try {
          const { error } = await sbClient.rpc("delete_message_with_admin", {
            msg_id: Number(id),
            admin_password: adminPasswordFromUrl
          });

          if (error) throw error;

          await loadMessages();
        } catch (error) {
          setStatus("messageStatus", t("actionFailed"), true);
          showDebug("Delete message failed", errorMessage(error));
        }
      }

      async function loadSupabaseAndData() {
        setStatus("updatesStatus", t("loadingUpdates"));
        setStatus("messageStatus", t("loadingMessages"));

        try {
          await loadSupabaseScript();

          if (!window.supabase || typeof window.supabase.createClient !== "function") {
            throw new Error("window.supabase.createClient is not available");
          }

          sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (error) {
          setStatus("updatesStatus", t("supabaseUnavailable"), true);
          setStatus("messageStatus", t("supabaseUnavailable"), true);
          showDebug("Supabase initialization failed", errorMessage(error));
          return;
        }

        try {
          await loadProfile();
        } catch (error) {
          showDebug("Load profile failed", errorMessage(error));
        }

        try {
          await loadUpdates();
        } catch (error) {
          setStatus("updatesStatus", t("loadFailed"), true);
          showDebug("Load updates failed", errorMessage(error));
        }

        try {
          await loadMessages();
        } catch (error) {
          setStatus("messageStatus", t("loadFailed"), true);
          showDebug("Load messages failed", errorMessage(error));
        }
      }

      function bindEvents() {
        $("langBtn").addEventListener("click", () => {
          lang = lang === "zh" ? "en" : "zh";
          localStorage.setItem("site_lang", lang);
          applyLanguage();
        });

        $("contactList").addEventListener("click", (event) => {
          const btn = event.target.closest("[data-copy]");
          if (!btn) return;
          copyText(btn.getAttribute("data-copy"));
        });

        $("profileForm").addEventListener("submit", saveProfile);

        $("newUpdateBtn").addEventListener("click", resetUpdateForm);
        $("cancelUpdateBtn").addEventListener("click", hideUpdateEditor);
        $("updateForm").addEventListener("submit", saveUpdate);

        $("updatesList").addEventListener("click", (event) => {
          const btn = event.target.closest("[data-update-action]");
          if (!btn) return;

          const action = btn.getAttribute("data-update-action");
          const id = btn.getAttribute("data-id");

          if (action === "edit") editUpdate(id);
          if (action === "hide") setUpdateVisible(id, false);
          if (action === "restore") setUpdateVisible(id, true);
          if (action === "delete") deleteUpdate(id);
        });

        $("messageForm").addEventListener("submit", sendMessage);

        $("messageList").addEventListener("click", (event) => {
          const btn = event.target.closest("[data-message-action]");
          if (!btn) return;

          const action = btn.getAttribute("data-message-action");
          const id = btn.getAttribute("data-id");

          if (action === "hide") setMessageVisible(id, false);
          if (action === "restore") setMessageVisible(id, true);
          if (action === "delete") deleteMessage(id);
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        setupAdminView();
        bindEvents();
        applyLanguage();
        loadSupabaseAndData();
      });
    })();
  </script>
</body>
</html>
